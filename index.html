<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de time tracker</title>
</head>
<body>
<main>
<h1>Editor de time tracker</h1>
<div class="bar">
  <label class="btn">Abrir archivo JSON<input id="file" type="file" accept=".json,application/json" hidden></label>
  <button id="paste">Pegar JSON</button>
  <button id="add">Nueva sesión</button>
  <button id="export" class="pri">Exportar JSON</button>
  <span id="status" class="note"></span>
</div>
<div id="io" class="panel" hidden>
  <textarea id="ta" class="big" spellcheck="false"></textarea>
  <div class="bar" style="margin:8px 0 0">
    <button id="ioOk" class="pri"></button><button id="ioCopy">Copiar</button><button id="ioDl">Descargar archivo</button><button id="ioClose">Cerrar</button>
    <span id="ioMsg" class="note"></span>
  </div>
</div>
<div id="newp" class="panel" hidden>
  <div class="form">
    <div><label>Fecha (desde)</label><input type="date" id="nFrom"></div>
    <div><label>Hasta (opcional, para repetir)</label><input type="date" id="nTo"></div>
    <div><label>Hora de inicio</label><input type="time" id="nStart"></div>
    <div><label>Hora de fin</label><input type="time" id="nEnd"></div>
    <div><label>Ticket</label><input id="nTicket" list="tickets"></div>
    <div><label>Notas</label><input id="nNotes" list="notesList"></div>
    <div><label>Pausa (min)</label><input type="number" id="nPause" min="0" step="0.1" value="0"></div>
    <div><label class="chk"><input type="checkbox" id="nWk" checked> Saltear fines de semana</label></div>
  </div>
  <div class="bar" style="margin:0"><button id="nOk" class="pri">Agregar</button><button id="nCancel">Cerrar</button><span id="nMsg" class="note"></span></div>
</div>
<div id="app"></div>
<datalist id="tickets"></datalist><datalist id="notesList"></datalist>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
